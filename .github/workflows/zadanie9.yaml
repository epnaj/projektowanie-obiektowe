name: Zadanie 9

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_SERVER: ghcr.io/epnaj/zadanie9-server
  IMAGE_CLIENT: ghcr.io/epnaj/zadanie9-client

jobs:
  build-app:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install client dependencies
        working-directory: zadanie5/client
        run: |
          npm install
          npm install prop-types

      - name: Build client (Vite production build)
        working-directory: zadanie5/client
        run: npm run build

      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: zadanie5/client/dist

      - name: Install & verify server
        working-directory: zadanie5/server
        run: |
          npm install
          node --check index.js

  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-app
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: zadanie5/server
          file: zadanie5/server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_SERVER }}:latest
            ${{ env.IMAGE_SERVER }}:${{ github.sha }}

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: zadanie5/client
          file: zadanie5/client/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_CLIENT }}:latest
            ${{ env.IMAGE_CLIENT }}:${{ github.sha }}

  regression-tests:
    name: Regression E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-app
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build app image (client + server)
        run: docker build -t z9-app -f zadanie8/zad-5.0/app.Dockerfile zadanie5

      - name: Build Playwright test image
        run: docker build -t z9-e2e zadanie8/zad-5.0

      - name: Start app container
        run: docker run --rm -d --network host --name z9-app z9-app

      - name: Wait for app to be ready (:8000)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 1
          done
          echo "App did not become ready in time"; docker logs z9-app || true; exit 1

      - name: Run Playwright regression suite
        run: docker run --rm --network host z9-e2e

      - name: Stop app container
        if: always()
        run: docker stop z9-app || true

  notify:
    name: Email notification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-app, build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Send build success email (SMTP)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.MAIL_FROM }}
          to: ${{ secrets.MAIL_TO }}
          subject: "[Zadanie 9] Aplikacja zbudowana — ${{ github.sha }}"
          body: |
            GH actions: aplikacja zbudowana

            Repozytorium: ${{ github.repository }}
            Commit:       ${{ github.sha }}
            Branch:       ${{ github.ref_name }}
            Workflow:     ${{ github.workflow }} (run #${{ github.run_number }})

            Opublikowane obrazy (ghcr.io):
              - ${{ env.IMAGE_SERVER }}:latest
              - ${{ env.IMAGE_SERVER }}:${{ github.sha }}
              - ${{ env.IMAGE_CLIENT }}:latest
              - ${{ env.IMAGE_CLIENT }}:${{ github.sha }}

  deploy:
    name: Deploy to cloud (Oracle VM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, regression-tests]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Trigger Watchtower update on VM (server + client)
        run: |
          curl -sSf \
            -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
            "${{ secrets.WATCHTOWER_URL }}/v1/update"
